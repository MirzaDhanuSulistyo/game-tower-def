<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0b1220; overflow: hidden; }
  body {
    font-family: "Arial Black", "Archivo Black", Impact, Haettenschweiler, sans-serif;
    color: #fff;
  }
  body.size-landscape { width: 1920px; height: 1080px; }
  body.size-portrait  { width: 800px;  height: 1200px; }
  body.size-square    { width: 800px;  height: 800px; }
  .frame { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .frame svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---- title block ---- */
  .title-block {
    position: absolute; left: 0; right: 0; top: 0;
    text-align: center; pointer-events: none;
  }
  body.size-landscape .title-block { padding-top: 56px; }
  body.size-portrait  .title-block { padding-top: 64px; }
  body.size-square    .title-block { padding-top: 44px; }
  .kicker {
    display: inline-block;
    font-family: Verdana, Geneva, sans-serif; font-weight: 700;
    letter-spacing: .42em; text-indent: .42em;
    color: #9fd8ff; text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }
  body.size-landscape .kicker { font-size: 30px; }
  body.size-portrait  .kicker,
  body.size-square    .kicker { font-size: 19px; }
  h1.title {
    font-weight: 900; line-height: .95; letter-spacing: .02em;
    background: linear-gradient(180deg, #fff6d8 8%, #ffd257 38%, #f59b23 62%, #ffe9a8 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #5b3208) drop-shadow(0 10px 22px rgba(0,0,0,.75));
    margin-top: 6px; padding: 0 20px;
  }
  body.size-landscape h1.title { font-size: 168px; }
  body.size-portrait  h1.title { font-size: 104px; }
  body.size-square    h1.title { font-size: 96px; }
  .tag {
    display: inline-block; margin-top: 14px;
    font-family: Verdana, Geneva, sans-serif; font-weight: 700;
    letter-spacing: .3em; text-indent: .3em;
    color: #0b1220; background: linear-gradient(180deg, #bfe9ff, #6fd3ff);
    border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.7);
  }
  body.size-landscape .tag { font-size: 30px; padding: 12px 34px 12px 40px; }
  body.size-portrait  .tag,
  body.size-square    .tag { font-size: 17px; padding: 9px 22px 9px 26px; }

  /* bottom shade so title + action read on any crop */
  .shade-top {
    position: absolute; left: 0; right: 0; top: 0; height: 34%;
    background: linear-gradient(180deg, rgba(5,9,16,.72), rgba(5,9,16,0));
  }
  .shade-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
    background: linear-gradient(0deg, rgba(5,9,16,.55), rgba(5,9,16,0));
  }
</style>
</head>

    <rect x="-200" y="-100" width="2000" height="1400" fill="none" stroke="#05090f" stroke-width="120" opacity=".55"/>
  </svg>

  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <div class="title-block">
    <div class="kicker">PHYSICS TOWER DEFENSE</div>
    <h1 class="title">RAMPART<br/>SIEGE</h1>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search).get('size');
  const scene = document.querySelector('svg.scene');
  // Same scene for all covers (consistent look); per-size crop keeps the
  // battle (cannon + bridge + horde) framed instead of empty sky.
  const boxes = {
    landscape: '0 0 1600 900',
    portrait: '350 100 720 1080',
    square: '380 180 720 720',
  };
  if (q === 'portrait' || q === 'square' || q === 'landscape') {
    document.body.className = 'size-' + q;
    scene.setAttribute('viewBox', boxes[q]);
  }
</script>
</body>
</html>
