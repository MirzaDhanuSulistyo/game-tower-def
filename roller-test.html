<!DOCTYPE html>
<html><head><meta charset="utf-8" />
<style>html,body{margin:0;background:#1c2733}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { makeEnemyMesh } from './src/entities.ts';
const W = 900, H = 700;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1c2733');
scene.add(new THREE.HemisphereLight('#bcd6ff', '#2a2118', 0.9));
const sun = new THREE.DirectionalLight('#fff2d8', 1.6);
sun.position.set(-6, 12, 8);
sun.castShadow = true;
scene.add(sun);
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(30, 1, 12),
  new THREE.MeshStandardMaterial({ color: '#3d5a3a' }),
);
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);
// reference lane surface at bridge height
const lane = new THREE.Mesh(
  new THREE.BoxGeometry(30, 0.06, 1.4),
  new THREE.MeshBasicMaterial({ color: '#c9a86a' }),
);
lane.position.y = 0.04;
scene.add(lane);
for (const [x, spin] of [[-3, 0], [3, 2.0]]) {
  const r = makeEnemyMesh('roller');
  r.position.set(x, 0.04, 0);
  const wheel = r.getObjectByName('wheel');
  if (wheel) wheel.rotation.x = spin;
  scene.add(r);
}
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
cam.position.set(0, 9, 10);
cam.lookAt(0, 0.4, 0);
renderer.render(scene, cam);
document.title = 'READY';
</script>
</body></html>
